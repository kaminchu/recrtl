[package]
name = "recrtl"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Rust ISDB-T one-segment recorder for RTL-SDR"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
libloading = "0.8"
reed-solomon = "0.2"
rustfft = "6"
serde_json = "1"

[profile.release]
lto = "thin"

[profile.test]
opt-level = 2
